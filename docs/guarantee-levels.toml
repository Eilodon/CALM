# Hand-maintained catalog of behavior guarantees -- rendered into
# docs/status.generated.md's "Guarantee levels" section by
# scripts/gen-status.sh (so a stale/undercited entry shows up in the same
# `gen-status.sh --check` CI drift gate a stale tool count would).
# See docs/plans/2026-08-03-product-truth-closure-plan.md PR2.
#
# This is NOT a general-purpose TOML file -- gen-status.sh's parser only
# understands the exact repeated `[[behavior]]` + flat `key = "value"` shape
# used below. Keep every field on one line, double-quoted, no literal `|`
# (breaks the generated Markdown table), no embedded double quotes.
#
# Level vocabulary -- pick exactly one per entry:
#   enforced           the system blocks/refuses if this isn't satisfied, no override
#   advisory           surfaced/nudged but never blocks on its own; can be ignored
#   best_effort        attempted, but a failure here is tolerated/logged, not
#                       blocking -- BY DESIGN, not a temporary gap
#   optional           off by default / opt-in; nothing happens unless enabled
#   provider_dependent guarantee level depends on an external tool/provider
#                       being installed and current
#   unsupported        a known gap -- not silently pretended to work
#
# Every entry needs `evidence`: a file (or file:line) a reader can go check
# the claim against, same discipline this repo's benchmarks already apply to
# measured claims.
#
# PR E (issue #66): every `level = "enforced"` entry ALSO needs `test` -- a
# `crate::module::path::test_fn_name` reference to the specific test that
# exercises the behavior this entry describes, so a semantic regression
# fails the build the same way a format/presence drift already does. Checked
# by crates/calm-core/tests/guarantee_contract_coverage.rs: every `enforced`
# entry must have a non-empty `test` field, and every `test` field must
# still resolve to a real `fn` somewhere under crates/ (catches a stale
# reference after a rename, not just a missing one). Not required for
# non-enforced levels -- advisory/best_effort/optional/provider_dependent/
# unsupported describe a DELIBERATE absence of a hard guarantee, so there is
# no single behavior a test could assert holds unconditionally.

[[behavior]]
id = "edit_context.before_hub_or_high_risk_write"
level = "enforced"
summary = "edit_context must have run THIS session for a hub/high-risk symbol before edit_lines/edit_symbol will apply a confirm:true write to it"
evidence = "crates/calm-server/src/tools/edit.rs (classify_gate, GateRequirement::EditContextConfirmGroundedReason)"
test = "calm-server::tools::tests::edit_lines_requires_confirm_for_hub_symbol"

[[behavior]]
id = "txn.begin_before_write"
level = "enforced"
summary = "a write is refused outright if the durable transaction journal fails to even start -- no write proceeds with no journal entry at all"
evidence = "crates/calm-server/src/tools/edit.rs (txn_init_failed, error code TRANSACTION_INIT_FAILED)"
test = "calm-server::tools::tests::edit_lines_aborts_when_txn_begin_fails"

[[behavior]]
id = "txn.transition_after_disk_write"
level = "best_effort"
summary = "once disk content has actually changed, later transitions (FileCommitted -> IndexCommitted -> Done) are non-blocking by design -- a failure there is recorded for repair_consistency to detect, not rolled back, since a post-write rollback is a materially riskier operation than tolerating a detectable drift"
evidence = "crates/calm-server/src/tools/txn.rs (module comment)"

[[behavior]]
id = "high_risk_edit.independent_review"
level = "enforced"
summary = "a greater-than-10-caller (critical/high-risk) edit without an independent elicitation approval is blocked outright -- a self-attested reason string alone is not sufficient at this risk tier"
evidence = "crates/calm-server/src/tools/edit.rs (high_risk_needs_independent_review, error code HIGH_RISK_REQUIRES_INDEPENDENT_REVIEW)"
test = "calm-server::tools::tests::high_risk_edit_off_elicitation_is_blocked_even_with_confirm_and_grounded_reason"

[[behavior]]
id = "diff_impact.before_commit"
level = "advisory"
summary = "diff_impact is documented as mandatory before commit/push, but CALM's MCP surface cannot itself block a git commit run outside its own tools -- any hard enforcement comes from an optional, separately-configured client-side hook, not from CALM"
evidence = "AGENTS.md workflow guide; crates/calm-cli/src/main.rs (apply_hooks_flag, --hooks=enforce)"

[[behavior]]
id = "scip_formal_edge_upgrade"
level = "provider_dependent"
summary = "an edge upgrades to formal confidence only when that language's SCIP or Stack Graphs provider is installed and its index is current -- an unavailable or stale provider leaves edges at their syntactic (textual/inferred/ambiguous) tier instead"
evidence = "repo_overview's health_summary.weak_cross_reference_languages; crates/calm-core/src/scip/mod.rs"

[[behavior]]
id = "tier0_5_language.ambiguous_heavy_edges"
level = "unsupported"
summary = "Tier-0.5 languages with no SCIP provider (Dart, Kotlin, OCaml, Scala, and others) land mostly in the ambiguous confidence tier on real-world corpora with common short or overloaded method names -- treat their callers/callees results as directional, not a complete or authoritative caller list"
evidence = "benchmarks/resolution/README.md (per-language resolved/textual/ambiguous split, e.g. Kotlin 89.6%, OCaml 86.3%, Dart 80.9% ambiguous)"

[[behavior]]
id = "format_files.no_semantic_gate"
level = "optional"
summary = "format_files (rustfmt) intentionally skips the confirm/edit_context gate since formatting cannot change program semantics -- a deliberate, scoped exemption, not a general write-path bypass"
evidence = "README.md Group/Tools table, Edit row"

[[behavior]]
id = "memory_note.staleness_detection"
level = "best_effort"
summary = "recall flags a note as stale/gone when a file reference it captured has since changed or been deleted, but a note with no captured file references at all is reported unchecked, not verified fresh -- staleness detection only covers what the note itself recorded a reference to"
evidence = "crates/calm-server/src/tools/memory.rs (MemoryNote.staleness field doc comment)"

[[behavior]]
id = "ledger.hmac_signed_not_plain_hash"
level = "enforced"
summary = "audit_ledger's event_hash is HMAC-SHA256(audit.key, payload||prev_hash) for every real on-disk connection, keyed by a 0600 per-project key file separate from the SQLite file it chains -- an actor with only SQLite write access (no audit.key) cannot forge a chain that still passes verify_chain, unlike the earlier plain SHA-256 chain where DB write access alone was sufficient. Falls back to the original unkeyed SHA-256 chain only for a path-less (:memory:) connection, which production code never opens"
evidence = "crates/calm-core/src/ledger.rs (compute_event_hash, ledger_key_for_conn, load_or_create_ledger_key)"
test = "calm-core::ledger::tests::real_on_disk_ledger_signs_with_hmac_not_plain_sha256"

[[behavior]]
id = "edit.risk_rules_path_floor"
level = "optional"
summary = "config.risk_rules (default empty) lets a project force a minimum risk level by file-path glob, e.g. {glob: \"**/auth/**\", minimum: \"high\"} -- a low-fan-in symbol in a matching path still hits the full write gate (edit_context+confirm+grounded_reason, plus independent-review for \"high\") exactly as a >10-caller symbol would, closing the gap where a security-sensitive file with few callers today reads as low risk. A floor only ever raises risk, never lowers it below the structural (caller-count/hub) signal"
evidence = "crates/calm-core/src/config.rs (RiskRule, risk_floor_for_path), crates/calm-server/src/tools/edit.rs (compute_touch_risk, classify_gate)"

[[behavior]]
id = "memory.quarantine_excludes_ambient_surfacing"
level = "enforced"
summary = "a project_memory note whose content trips sanitize::injection_warning is quarantined at write time and excluded from recall's ambient/broad paths (FTS query search, no-args list-all) by default -- only an explicit recall(include_quarantined=true) or an exact-topic lookup (a deliberate, targeted ask, mirroring edit_context's own related_notes gate) returns it. The note is still saved either way (detection-only), and every returned note still carries its own content_warning/quarantined fields regardless of this filter"
evidence = "crates/calm-server/src/tools/memory.rs (remember, recall), crates/calm-core/src/db/schema.rs (project_memory.quarantined)"
test = "calm-server::tools::tests::recall_list_all_excludes_quarantined_notes_by_default"

[[behavior]]
id = "verification.rust_check_on_write"
level = "optional"
summary = "WS-6 first slice: off by default (config.verification.rust_check_on_write=false); when turned on, a .rs write parks at VERIFY_PENDING until verify_change runs cargo check on it, and a failing check does not revert the file already on disk"
evidence = "crates/calm-core/src/config.rs (VerificationConfig), crates/calm-server/src/tools/txn.rs (verify_change), docs/plans/2026-08-03-ws6-verification-pipeline-execution-plan.md"

[[behavior]]
id = "verification.bound_to_proposed_digest"
level = "enforced"
summary = "verify_change refuses to run (and never advances the transaction) if the file on disk no longer matches the tx_id's proposed_digest, checked both immediately before and immediately after cargo check runs -- a concurrent write can never get bound to someone else's verification receipt"
evidence = "crates/calm-server/src/tools/txn.rs (verify_change, VERIFICATION_SNAPSHOT_CHANGED)"
test = "calm-server::tools::tests::verify_change_refuses_when_disk_no_longer_matches_proposed_digest"

[[behavior]]
id = "http.remote_bind_forces_read_only_hint_tools_only"
level = "enforced"
summary = "any non-loopback `calm serve --http` bind forces the effective preset to remote-safe (every tool with read_only_hint=true, computed live off the tool router) regardless of --preset -- covers every state-mutating/process-executing tool (remember, verify_change, retry_maintenance, scip_refresh, lsp_refresh, set_toolset, pattern_debt_register, edit_lines/edit_symbol/format_files), not just the edit toolset the earlier full,-edit preset excluded"
evidence = "crates/calm-cli/src/http.rs (resolve_http_launch), crates/calm-server/src/tools/toolset.rs (remote_safe_tool_names, resolve_preset), crates/calm-cli/tests/http_guard.rs"
test = "calm-cli::http_guard::allow_remote_with_valid_token_forces_a_read_only_preset"

[[behavior]]
id = "verification.timeout_secs"
level = "enforced"
summary = "cargo check is killed if it exceeds config.verification.timeout_secs (default 120s) -- a hung build.rs/proc-macro/registry fetch fails the verification instead of blocking the tool call indefinitely"
evidence = "crates/calm-core/src/verify.rs (run_cargo_check, DEFAULT_VERIFY_TIMEOUT_SECS), crates/calm-core/src/config.rs (VerificationConfig::timeout_secs)"
test = "calm-core::verify::tests::run_cargo_check_kills_and_reports_failure_on_timeout"
