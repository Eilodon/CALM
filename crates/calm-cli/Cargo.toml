[package]
name = "calm-cli"
version.workspace = true
edition.workspace = true

# Small lib target added alongside the `calm` bin (Phase 2, docs/superskills/
# plans/2026-07-28-otel-http-dynamic-toolsets.md Task 2.3) so `otel::otel_layer`
# is reachable from `tests/otel_gate.rs` as an integration test -- calm-cli
# was bin-only before this; the bin still owns all CLI/serve logic, this lib
# only exists to expose testable modules (otel.rs) beyond main.rs itself.
[lib]
name = "calm_cli"
path = "src/lib.rs"

[[bin]]
name = "calm"
path = "src/main.rs"

[dependencies]
calm-core = { workspace = true }
calm-server = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
# Real (non-dev) dependency, matching calm-server's own libc entry: needed by
# src/bin/txn_crash_harness.rs (WS-1 task 4.8 crash-injection suite,
# docs/plans/2026-08-02-phase1-p0-execution-plan.md §6) for `libc::raise` --
# a `[[bin]]` target only sees `[dependencies]`, never `[dev-dependencies]`.
libc = "0.2"
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["embeddings", "tier0-5", "scip-overlay", "stack-graphs-formal"]
embeddings = ["calm-core/embeddings", "calm-server/embeddings"]
# Passthrough -- without this the feature can't be turned off from the
# shipped `calm` binary's --features flag at all (same reasoning as
# lsp-overlay/http below). See docs/superskills/specs/2026-07-30-
# stack-graphs-demotion-lever.md (D1).
stack-graphs-formal = ["calm-core/stack-graphs-formal", "calm-server/stack-graphs-formal"]
# D, docs/superskills/plans/2026-07-30-calm-dfb-levers-design.md §3 -- opt-in,
# NOT in `default`. No calm-server passthrough needed: calm-server only ever
# calls calm-core's Embedder::load(model_id, dim) generically and has no
# onnx-specific code of its own -- Cargo's feature unification means any
# calm-core instance built into this binary already has onnx-embeddings on
# once this crate requests it, regardless of which crate's Cargo.toml asked.
onnx-embeddings = ["calm-core/onnx-embeddings"]
lang-c      = ["calm-core/lang-c",      "calm-server/lang-c"]
lang-cpp    = ["calm-core/lang-cpp",    "calm-server/lang-cpp"]
lang-ruby   = ["calm-core/lang-ruby",   "calm-server/lang-ruby"]
lang-kotlin = ["calm-core/lang-kotlin", "calm-server/lang-kotlin"]
lang-swift  = ["calm-core/lang-swift",  "calm-server/lang-swift"]
lang-scala  = ["calm-core/lang-scala",  "calm-server/lang-scala"]
lang-dart   = ["calm-core/lang-dart",   "calm-server/lang-dart"]
lang-lua    = ["calm-core/lang-lua",    "calm-server/lang-lua"]
lang-elixir = ["calm-core/lang-elixir", "calm-server/lang-elixir"]
lang-haskell = ["calm-core/lang-haskell", "calm-server/lang-haskell"]
lang-ocaml = ["calm-core/lang-ocaml", "calm-server/lang-ocaml"]
lang-zig = ["calm-core/lang-zig", "calm-server/lang-zig"]
lang-powershell = ["calm-core/lang-powershell", "calm-server/lang-powershell"]
lang-groovy = ["calm-core/lang-groovy", "calm-server/lang-groovy"]
lang-php    = ["calm-core/lang-php",    "calm-server/lang-php"]
lang-csharp = ["calm-core/lang-csharp", "calm-server/lang-csharp"]
lang-shell  = ["calm-core/lang-shell",  "calm-server/lang-shell"]
lang-r      = ["calm-core/lang-r",      "calm-server/lang-r"]
tier0-5     = ["calm-core/tier0-5",     "calm-server/tier0-5"]
scip-overlay = ["calm-core/scip-overlay", "calm-server/scip-overlay"]
# Opt-in OpenTelemetry span export (Phase 2, docs/superskills/plans/2026-07-28-otel-http-dynamic-toolsets.md).
# Even when built with this feature, the pipeline stays inert unless
# OTEL_EXPORTER_OTLP_ENDPOINT is also set at runtime (crates/calm-cli/src/otel.rs).
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
# Opt-in remote/HTTP transport passthrough (Phase 3, same plan) -- without
# this the feature is unreachable from the shipped `calm` binary, same
# reasoning as the lsp-overlay passthrough below.
http = ["calm-server/http"]
# Opt-in, not in `default` yet — see calm-core's `lsp-overlay` feature comment.
# Without this passthrough the feature is unreachable from the shipped `calm`
# binary entirely (caught in the 2026-07-10 review).
lsp-overlay  = ["calm-core/lsp-overlay",  "calm-server/lsp-overlay"]
