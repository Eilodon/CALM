# B7 Phase 1 refactor tasks -- deliberately a SEPARATE file from tasks.yaml
# (see docs/superskills/specs/2026-07-30-calm-dfb-levers-design.md §1.3a for
# why: this schema describes a target corpus + a real mutation + a real
# build/test command, structurally different from tasks.yaml's single-lookup
# `naive`/`ci` shape consumed by B4/B6/B11 -- zero blast radius on those three
# by keeping this separate).
#
# Each task's `oracle_callsites` is NOT hand-typed -- it's the live output of
# benchmarks/b7_task_correctness/oracle.py::real_call_sites (B12's
# ground_truth.git_grep_call_sites, extension-filtered), reproduced this
# session against the pinned commits below. Re-verify with the same call if
# the pinned commit changes:
#   benchmarks/.venv/bin/python3 -c "
#   import sys; sys.path.insert(0, 'benchmarks/b7_task_correctness')
#   from oracle import real_call_sites
#   from pathlib import Path
#   print(real_call_sites(Path('<corpus>'), '<symbol>', '<def_path>', <def_line>, '<lang>', ('.ext',)))"
#
# Corpora are B12's pinned registry (benchmarks/b12_tier1_tier2_tool_correctness/corpora.py)
# -- reused directly per the design's Finding A3, not re-cloned from scratch.

tasks:
  - id: rename_fd_pattern_matches_leading_dot
    lang: rust
    corpus: rust  # key into b12_tier1_tier2_tool_correctness.corpora.get_corpus()
    symbol: pattern_matches_strings_with_leading_dot
    def_path: src/regex_helper.rs
    def_line: 40
    new_name: pattern_matches_strings_with_leading_period
    # verified live 2026-07-30 against fd @ 41532d114e2ba565fb5367d606c111b29b96450c
    oracle_callsites:
      - [src/main.rs, 529]
      - [src/regex_helper.rs, 100]
      - [src/regex_helper.rs, 102]
      - [src/regex_helper.rs, 103]
      - [src/regex_helper.rs, 104]
    build_cmd: null  # `cargo test` builds+tests in one step for Rust
    test_cmd: ["cargo", "test", "--quiet"]

  - id: rename_flask_from_prefixed_env
    lang: python
    corpus: python  # key into b12_tier1_tier2_tool_correctness.corpora.get_corpus()
    symbol: from_prefixed_env
    def_path: src/flask/config.py
    def_line: 126
    new_name: from_prefixed_environ
    # verified live 2026-07-30 against flask @ 36e4a824f340fdee7ed50937ba8e7f6bc7d17f81
    # (examples/celery/... is a REAL .py callsite pytest never exercises directly --
    # deliberately kept in the oracle: this is exactly the case build/test-pass
    # alone would miss but callsite recall catches, illustrating why B7 uses
    # both oracle legs, not just one)
    oracle_callsites:
      - [examples/celery/src/task_app/__init__.py, 16]
      - [tests/test_config.py, 58]
      - [tests/test_config.py, 74]
      - [tests/test_config.py, 87]
    build_cmd: ["uv", "sync", "--frozen"]
    # NOT bare `pip install pytest` -- verified live this session that flask's
    # pyproject.toml pins pytest via uv.lock (`[tool.uv] default-groups`
    # includes "tests") and `filterwarnings = ["error"]` in
    # [tool.pytest.ini_options] means a version-mismatched pytest can fail
    # tests outright (reproduced: bare-latest pytest broke test_cli.py's
    # `from _pytest.monkeypatch import notset` import, an internal API
    # removed upstream).
    test_cmd: ["uv", "run", "pytest", "-q"]

  # --- Phase 2 continued: Go toolchain installed later the same day (user
  # provided sudo access specifically to unblock this) -- gin/Go added below.

  - id: rename_gin_clean_path
    lang: go
    corpus: go  # key into b12_tier1_tier2_tool_correctness.corpora.get_corpus()
    symbol: cleanPath
    def_path: path.go
    def_line: 23
    new_name: normalizeUrlPath
    # verified live 2026-07-30 against gin @ 34dac209ffb6ef85cc78c5d217bbb7ad001d68fd.
    # Same package (no cross-package qualification needed -- Go doesn't have
    # JS's require()-property-access call shape, so this cleanly isolates
    # the rename question from the property-access-call finding seen in
    # express/setCharset). Real production usage (gin.go, 2 sites) + heavy
    # test coverage (path_test.go, 6 sites) + 1 doc-comment mention
    # (path.go:10, included deliberately -- a thorough rename should update
    # doc comments too, even though the build doesn't strictly require it).
    oracle_callsites:
      - [gin.go, 704]
      - [gin.go, 812]
      - [path.go, 10]
      - [path_test.go, 74]
      - [path_test.go, 75]
      - [path_test.go, 89]
      - [path_test.go, 99]
      - [path_test.go, 130]
      - [path_test.go, 131]
      - [path_test.go, 142]
    build_cmd: ["go", "build", "./..."]
    test_cmd: ["go", "test", "./..."]

  - id: rename_express_set_charset
    lang: javascript
    corpus: javascript  # key into b12_tier1_tier2_tool_correctness.corpora.get_corpus()
    symbol: setCharset
    def_path: lib/utils.js
    def_line: 225
    new_name: applyCharset
    # verified live 2026-07-30 against express @ a3714473feb3d2908add734d340e7755fd85e0a3
    # (lib/response.js is real production usage; test/utils.js is direct test
    # coverage -- a missed rename here fails BOTH the build-gate AND recall)
    oracle_callsites:
      - [lib/response.js, 141]
      - [test/utils.js, 48]
      - [test/utils.js, 50]
      - [test/utils.js, 54]
      - [test/utils.js, 58]
      - [test/utils.js, 62]
      - [test/utils.js, 66]
    build_cmd: ["npm", "install"]
    test_cmd: ["npm", "test"]

  # REJECTED candidate (kept as an audit trail, matching this project's own
  # convention -- e.g. the B10->B11 supersession note): `slugify`
  # (packages/zod/src/v4/core/util.ts:347). It passed B12's
  # unique_definitions filter (which only scans free function/class/
  # interface/type regex patterns) but is actually a 3-way name collision:
  # util.ts's free function -> called by api.ts's `_slugify` -> re-exported
  # as `_slugify as slugify` in checks.ts -> and ALSO an unrelated
  # `_ZodString.slugify()` fluent builder method in schemas.ts that calls
  # `checks.slugify()`, not util.ts's function at all. Plain-text word-bounded
  # substitution (this benchmark's mutation mechanism for both arms) cannot
  # tell these apart, so neither arm's result on this symbol would measure
  # anything real -- both a genuine methodological finding (B12's
  # unique_definitions doesn't see object-literal/class-method definitions,
  # only top-level declarations) and a real reminder that CALM's own
  # `ambiguous`-tier problem (the parent D/F/B research doc's arity-gate
  # work) is exactly this shape of collision. Replaced with a cleaner,
  # single-symbol pick below.
  - id: rename_zod_prettify_error
    lang: typescript
    corpus: typescript  # key into b12_tier1_tier2_tool_correctness.corpora.get_corpus()
    symbol: prettifyError
    def_path: packages/zod/src/v4/core/errors.ts
    def_line: 442
    new_name: formatErrorForDisplay
    # verified live 2026-07-30 against zod @ 912f0f51b0ced654d0069741e7160834dca742ee.
    # Single definition, plain re-exports only (classic/external.ts,
    # mini/external.ts -- no renaming alias like slugify's), called via the
    # public `z.prettifyError(...)` -- same qualified-call shape as the
    # rejected slugify pick and express's setCharset finding, but WITHOUT
    # the name-collision confound, so this cleanly isolates just the
    # qualified-call-resolution question.
    oracle_callsites:
      - [packages/zod/src/v4/classic/tests/error-utils.test.ts, 451]
      - [packages/zod/src/v4/classic/tests/error-utils.test.ts, 544]
    build_cmd: ["pnpm", "install"]
    test_cmd: ["pnpm", "test"]
